name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.0'
          cache: npm
      - run: npm ci
      - run: node scripts/verify-cowork-broker.mjs
      - run: npm test
      - run: npm run build
      - run: npx playwright install chromium webkit
      - run: npm run verify -- --portable
